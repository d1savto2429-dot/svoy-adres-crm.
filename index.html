<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Свой Адрес — CRM</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172b3a;margin:0}main{max-width:900px;margin:auto;padding:24px}section,article{background:white;border-radius:12px;padding:20px;margin:12px 0}input,button{font:inherit;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #bac7ce}input{box-sizing:border-box;width:100%}button{background:#164e63;color:white;cursor:pointer}p{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>Свой Адрес</h1><section id="login"><h2>Вход в CRM</h2><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form></section><section id="panel" hidden><button id="logout">Выйти</button> <button id="apps">Заявки</button> <button id="clients">Клиенты</button><h2 id="heading"></h2><div id="rows"></div></section><p id="message" role="status"></p></main><script>const $=id=>document.getElementById(id);let token="";async function api(path,body){const r=await fetch('https://epdwenynvnhpdfsmcxlk.supabase.co/functions/v1/crm',{method:"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify({action:path,...body})});if(!r.ok)throw Error("Ошибка доступа или соединения");return r.json()}async function load(action){try{const data=await api(action);$("heading").textContent=action==="apps"?"Заявки":"Клиенты";$("rows").replaceChildren();for(const item of data){const a=document.createElement("article");const p=document.createElement("p");p.textContent=action==="apps"?[item.service,item.status,item.details].join("\n"):[item.full_name,item.phone].join("\n");a.append(p);$("rows").append(a)}$("message").textContent=""}catch(e){$("message").textContent=e.message}}$("form").onsubmit=async e=>{e.preventDefault();try{const data=await api("login",{email:$("email").value,password:$("password").value});token=data.token;$("password").value="";$("login").hidden=true;$("panel").hidden=false;await load("apps")}catch(e){$("message").textContent=e.message}};$("apps").onclick=()=>load("apps");$("clients").onclick=()=>load("clients");$("logout").onclick=()=>{token="";$("rows").replaceChildren();$("panel").hidden=true;$("login").hidden=false};</script></html>
