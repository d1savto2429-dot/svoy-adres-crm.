<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Свой Адрес — CRM</title><style>body{font:16px system-ui;background:#f1f5f9;color:#172b3a;margin:0}main{max-width:900px;margin:auto;padding:24px}section,article{background:white;border-radius:12px;padding:20px;margin:12px 0}input,button{font:inherit;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #bac7ce}input{box-sizing:border-box;width:100%}button{background:#164e63;color:white;cursor:pointer}p{white-space:pre-wrap;overflow-wrap:anywhere}nav{display:flex;flex-wrap:wrap;gap:8px}article{border:1px solid #dbe4ea}button{border:0}h1{letter-spacing:-1px}#stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}#stats div{background:#e6f0f4;padding:16px;border-radius:10px}#stats strong{display:block;font-size:28px}select{font:inherit;padding:10px;max-width:100%}</style><main><h1>Свой Адрес</h1><small>CRM · версия 3</small><section id="login"><h2>Вход в CRM</h2><form id="form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form></section><section id="panel" hidden><button id="logout">Выйти</button> <button id="apps">Заявки</button> <button id="clients">Клиенты</button><h2 id="heading"></h2><div id="stats"></div><input id="search" placeholder="Поиск"><select id="filter"><option value="">Все статусы</option></select><div id="rows"></div></section><p id="message" role="status"></p></main><script>const $=id=>document.getElementById(id);let token="",items=[],mode="apps";const statuses=["Новая","В работе","Ожидаем документы","Назначена встреча","Завершена","Отменена"];for(const s of statuses){const o=document.createElement("option");o.value=o.textContent=s;$("filter").append(o)}async function api(path,body){const r=await fetch('https://epdwenynvnhpdfsmcxlk.supabase.co/functions/v1/crm',{method:"POST",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:JSON.stringify({action:path,...body})});if(!r.ok)throw Error("Ошибка доступа или соединения");return r.json()}async function load(action){try{const data=await api(action);items=data;mode=action;$("search").value="";$("filter").value="";render();}catch(e){$("message").textContent=e.message}}function render(){const action=mode;const data=items.filter(x=>JSON.stringify(x).toLowerCase().includes($("search").value.toLowerCase())&&(action!=="apps"||!$("filter").value||x.status===$("filter").value));$("filter").hidden=action!=="apps";$("stats").replaceChildren();if(action==="apps"){for(const [label,n] of [["Всего в списке",items.length],["Новые",items.filter(x=>x.status==="Новая").length],["Активные",items.filter(x=>["В работе","Ожидаем документы","Назначена встреча"].includes(x.status)).length],["Завершённые",items.filter(x=>x.status==="Завершена").length]]){const d=document.createElement("div"),b=document.createElement("strong");b.textContent=n;d.append(b,label);$("stats").append(d)}}$("heading").textContent=action==="apps"?"Заявки":"Клиенты";$("rows").replaceChildren();for(const item of data){const a=document.createElement("article");const p=document.createElement("p");p.textContent=action==="apps"?[item.service,item.status,item.details].join("\n"):[item.full_name,item.phone].join("\n");a.append(p);if(action==="apps"){const contact=document.createElement("p");contact.textContent=[item.clients?.full_name,item.clients?.phone].filter(Boolean).join(" · ");a.append(contact);const b=document.createElement("button");b.textContent="Взять в работу";if(!item.assigned_telegram_id&&item.status==="Новая"){b.onclick=()=>change(item,{take:true});a.append(b)}if(item.assigned_telegram_id){const sel=document.createElement("select");for(const s of statuses){const o=document.createElement("option");o.value=o.textContent=s;sel.append(o)}sel.value=item.status;const save=document.createElement("button");save.textContent="Сохранить статус";save.onclick=()=>change(item,{status:sel.value});a.append(sel,save)}}$("rows").append(a)}$("message").textContent=""}async function change(item,values){try{const result=await api("change",{id:item.id,...values});await load("apps");$("message").textContent=result.notified?"Сохранено. Клиент уведомлён.":"Сохранено. Уведомление не подтверждено."}catch(e){$("message").textContent=e.message}}$("search").oninput=render;$("filter").onchange=render;$("form").onsubmit=async e=>{e.preventDefault();try{const data=await api("login",{email:$("email").value,password:$("password").value});token=data.token;$("password").value="";$("login").hidden=true;$("panel").hidden=false;await load("apps")}catch(e){$("message").textContent=e.message}};$("apps").onclick=()=>load("apps");$("clients").onclick=()=>load("clients");$("logout").onclick=()=>{token="";items=[];$("stats").replaceChildren();$("rows").replaceChildren();$("panel").hidden=true;$("login").hidden=false};</script></html>
